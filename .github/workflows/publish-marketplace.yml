name: Publish Twenty Marketplace package
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'Release channel on npm'
        required: true
        default: beta
        type: choice
        options:
          - beta
          - latest
      confirmation:
        description: 'Type PUBLICAR to confirm a public npm release'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: ${{ (github.event_name == 'push' || inputs.confirmation == 'PUBLICAR') && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: npm-publication
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
          registry-url: https://registry.npmjs.org
      - name: Prepare dependencies
        run: |
          corepack enable
          npm install -g npm@latest
          corepack yarn install
      - name: Verify version and public flag
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); if(p.private)process.exit(1); if(process.env.GITHUB_REF_NAME !== `v${p.version}`)process.exit(2);'
      - name: Check and publish to npm with provenance
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          corepack yarn check
          corepack yarn test
          corepack yarn twenty app:publish --tag "${{ inputs.dist_tag || 'beta' }}"
