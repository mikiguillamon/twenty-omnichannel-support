name: Publish Omnichannel n8n node to npm
on:
  push:
    branches: [main]
    paths:
      - integrations/n8n-nodes-omnichannel-support/package.json
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish from the node's package.json
        type: string
        required: true
permissions:
  contents: read
defaults:
  run:
    working-directory: integrations/n8n-nodes-omnichannel-support
concurrency:
  group: publish-omnichannel-n8n-node
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check the node version against npm
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node <<'JS'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const pkg = require('./package.json');
          const expectedRepository = 'git+https://github.com/' + process.env.GITHUB_REPOSITORY + '.git';
          const stableVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          if (pkg.name !== 'n8n-nodes-omnichannel-support' || pkg.repository?.url !== expectedRepository) {
            throw new Error('Unexpected package name or GitHub repository');
          }
          if (!stableVersion.test(pkg.version)) throw new Error('Expected a stable version in the node package.json');
          if (process.env.REQUESTED_VERSION && pkg.version !== process.env.REQUESTED_VERSION) {
            throw new Error('Enter the version in the node package.json');
          }
          const metadata = JSON.parse(execFileSync('npm', [
            'view', pkg.name, 'versions', 'dist-tags', '--json', '--prefer-online',
          ], { encoding: 'utf8' }));
          if (!Array.isArray(metadata.versions)) throw new Error('Unexpected versions metadata from npm');
          if (metadata.versions.includes(pkg.version)) {
            console.log(pkg.name + '@' + pkg.version + ' is already published');
            process.exit(0);
          }
          const latest = metadata['dist-tags']?.latest;
          if (!stableVersion.test(latest ?? '')) {
            throw new Error('Publish or approve the first stable version on npm before using this workflow');
          }
          if (pkg.version.localeCompare(latest, 'en', { numeric: true }) <= 0) {
            throw new Error('The node version must be newer than npm latest (' + latest + ')');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + pkg.version + '\n');
          JS
      - run: npm ci
        if: steps.release.outputs.version != ''
      - run: npm run lint
        if: steps.release.outputs.version != ''
      - run: npm test
        if: steps.release.outputs.version != ''
      - name: Pack and publish
        if: steps.release.outputs.version != ''
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm publish "$RUNNER_TEMP/n8n-nodes-omnichannel-support-$RELEASE_VERSION.tgz" --access public --tag latest --provenance
      - name: Verify npm latest
        if: steps.release.outputs.version != ''
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in $(seq 1 32); do
            if [ "$(npm view n8n-nodes-omnichannel-support dist-tags.latest --prefer-online --fetch-retries=0)" = "$RELEASE_VERSION" ]; then
              echo "Verified npm latest = $RELEASE_VERSION"
              exit 0
            fi
            sleep 15
          done
          echo "npm did not report $RELEASE_VERSION as latest within the verification window"
          exit 1
