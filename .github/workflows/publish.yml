name: Publish Omnichannel Support to npm
on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing npm version to promote to latest (for example 0.3.0-beta.8)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'release' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish npm]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check Release prerelease flag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Expected a vX.Y.Z tag"; exit 1 ;;
          esac
          case "$RELEASE_TAG" in
            *-*) test "$RELEASE_PRERELEASE" = "true" || { echo "Prerelease must be marked prerelease"; exit 1; } ;;
            *) test "$RELEASE_PRERELEASE" = "false" || { echo "Stable cannot be marked prerelease"; exit 1; } ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require the release commit on main
        if: github.event_name == 'release'
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "Release tag commit is not in main"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
          registry-url: https://registry.npmjs.org
      - name: Install reproducible dependencies
        run: |
          corepack enable
          corepack yarn install --immutable
      - name: Validate public release metadata and tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            node scripts/release-preflight.mjs --public --tag "$RELEASE_TAG"
          else
            node scripts/release-preflight.mjs --public
            CURRENT="$(node -p "require('./package.json').version")"
            PREVIOUS="$(git show HEAD^:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
            test "$CURRENT" != "$PREVIOUS" || { echo "Package version was not changed"; exit 1; }
            case "$CURRENT" in *-beta.[0-9]*) ;; *) echo "Expected a beta version"; exit 1;; esac
            if npm view "twenty-omnichannel-support@$CURRENT" version --json >/dev/null 2>&1; then
              echo "Version already published, refusing to overwrite"; exit 1
            fi
          fi
      - name: Tests, types and Twenty SDK build
        run: |
          corepack yarn check
          corepack yarn test
          corepack yarn twenty dev:build --tarball
      - name: Inspect distribution
        shell: bash
        run: |
          test -s .twenty/output/manifest.json
          test -s .twenty/output/package.json
          test -s .twenty/output/LICENSE
          cmp -s LICENSE .twenty/output/LICENSE
          TARBALL=$(find .twenty/output -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$TARBALL"
          tar -tzf "$TARBALL" | grep -Fx 'package/LICENSE'
          if find .twenty/output -type f | grep -E '/(\.env|\.npmrc|[^/]*\.pem|[^/]*\.key)$'; then
            echo "Unexpected sensitive file in distribution"; exit 1
          fi
          echo "Twenty output manifest and package found"
      - name: Install npm with OIDC support
        run: npm install --global 'npm@^11.21.0'
      - name: Publish beta to npm
        if: github.event_name == 'push' || github.event.release.prerelease == true
        run: corepack yarn twenty app:publish --tag beta
      - name: Publish stable to npm
        if: github.event_name == 'release' && github.event.release.prerelease == false
        run: corepack yarn twenty app:publish

      - name: Promote released beta to npm latest
        if: github.event_name == 'push' || github.event.release.prerelease == true
        id: promote_latest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npm dist-tag add "twenty-omnichannel-support@$VERSION" latest
          npm dist-tag ls twenty-omnichannel-support
          VERSION="$(node -p "require('./package.json').version")"
          npm view "twenty-omnichannel-support" dist-tags --json > /tmp/dist-tags.json
          node -e "const tags=require('/tmp/dist-tags.json'); const v=require('./package.json').version; if(tags.beta!==v || tags.latest!==v)process.exit(1)"

  promote_existing:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[promote npm]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
          registry-url: https://registry.npmjs.org
      - name: Install npm with dist-tag OIDC support
        run: npm install --global 'npm@^11.21.0'
      - name: Promote an existing published version
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [ -z "$PACKAGE_VERSION" ]; then
            PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          fi
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Expected a valid published version (for example 0.3.0-beta.8)"
            exit 1
          fi
          npm dist-tag add "twenty-omnichannel-support@$PACKAGE_VERSION" latest
          npm dist-tag ls twenty-omnichannel-support
          npm view twenty-omnichannel-support dist-tags --json > /tmp/promoted-tags.json
          node -e "const tags=require('/tmp/promoted-tags.json'); const v=process.argv[1]; if(tags.beta!==v || tags.latest!==v)process.exit(1)" "$PACKAGE_VERSION"
