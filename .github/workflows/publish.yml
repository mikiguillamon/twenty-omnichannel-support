name: Publish Omnichannel Support to npm
on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing npm version to promote to latest (for example 0.3.0-beta.8)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    if: github.event_name == 'release' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[publish npm]') || contains(github.event.head_commit.message, '[publish stable]')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check Release prerelease flag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Expected a vX.Y.Z tag"; exit 1 ;;
          esac
          case "$RELEASE_TAG" in
            *-*) test "$RELEASE_PRERELEASE" = "true" || { echo "Prerelease must be marked prerelease"; exit 1; } ;;
            *) test "$RELEASE_PRERELEASE" = "false" || { echo "Stable cannot be marked prerelease"; exit 1; } ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require the release commit on main
        if: github.event_name == 'release'
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "Release tag commit is not in main"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
          registry-url: https://registry.npmjs.org
      - name: Install reproducible dependencies
        run: |
          corepack enable
          corepack yarn install --immutable
      - name: Validate public release metadata and tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            node scripts/release-preflight.mjs --public --tag "$RELEASE_TAG"
          else
            node scripts/release-preflight.mjs --public
            CURRENT="$(node -p "require('./package.json').version")"
            if [[ "${{ github.event.head_commit.message }}" == *"[publish stable]"* ]]; then
              # Stable publication requires the reviewed release commit on main.
              if [[ "$CURRENT" == *-* ]]; then echo "Stable release cannot be a prerelease"; exit 1; fi
            else
              case "$CURRENT" in *-beta.[0-9]*) ;; *) echo "Expected a beta version"; exit 1;; esac
              if npm view "twenty-omnichannel-support@$CURRENT" version --json >/dev/null 2>&1; then
                echo "Version already published, refusing to overwrite"; exit 1
              fi
            fi
          fi
      - name: Tests, types and Twenty SDK build
        run: |
          corepack yarn check
          corepack yarn test
          corepack yarn twenty dev:build --tarball
      - name: Inspect distribution
        shell: bash
        run: |
          test -s .twenty/output/manifest.json
          test -s .twenty/output/package.json
          test -s .twenty/output/LICENSE
          cmp -s LICENSE .twenty/output/LICENSE
          TARBALL=$(find .twenty/output -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$TARBALL"
          tar -tzf "$TARBALL" | grep -Fx 'package/LICENSE'
          if find .twenty/output -type f | grep -E '/(\.env|\.npmrc|[^/]*\.pem|[^/]*\.key)$'; then
            echo "Unexpected sensitive file in distribution"; exit 1
          fi
          echo "Twenty output manifest and package found"
      - name: Install npm with OIDC support
        run: npm install --global 'npm@^11.21.0'
      - name: Publish beta to npm
        if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[publish stable]')) || (github.event_name == 'release' && github.event.release.prerelease == true)
        run: corepack yarn twenty app:publish --tag beta
      - name: Publish stable to npm
        if: (github.event_name == 'release' && github.event.release.prerelease == false) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish stable]'))
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "twenty-omnichannel-support@$VERSION" version --json >/dev/null 2>&1; then
            echo "$VERSION already published; will verify and ensure latest dist-tag"
          else
            corepack yarn twenty app:publish
          fi
      - name: Verify stable latest dist-tag
        if: (github.event_name == 'release' && github.event.release.prerelease == false) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish stable]'))
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 60); do
            if npm dist-tag add "twenty-omnichannel-support@$VERSION" latest; then break; fi
            if [ "$attempt" -eq 60 ]; then echo "Could not set npm latest"; exit 1; fi
            sleep 10
          done
          for attempt in $(seq 1 60); do
            npm view twenty-omnichannel-support dist-tags --json --prefer-online --cache "/tmp/npm-stable-tag-check-$attempt" > /tmp/stable-tags.json
            if node -e "const tags=require('/tmp/stable-tags.json');const version=require('./package.json').version;if(tags.latest!==version)process.exit(1)"; then
              echo "Verified npm latest = $VERSION"
              break
            fi
            if [ "$attempt" -eq 60 ]; then cat /tmp/stable-tags.json; exit 1; fi
            sleep 10
          done
      - name: Create first stable GitHub release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish stable]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub release v$VERSION already exists"
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Omnichannel Support v$VERSION" --notes-file "docs/RELEASE_NOTES_${VERSION//./_}.md" --latest
          fi

      - name: Promote released beta to npm latest
        if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[publish stable]')) || (github.event_name == 'release' && github.event.release.prerelease == true)
        id: promote_latest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # npm may acknowledge publishing before its dist-tags are consistently readable.
          # Retry only the tag operation; never republish an immutable npm version.
          promoted=false
          for attempt in $(seq 1 60); do
            if npm dist-tag add "twenty-omnichannel-support@$VERSION" latest; then
              promoted=true
              break
            fi
            echo "npm latest promotion not ready (attempt $attempt/60); retrying."
            sleep 10
          done
          test "$promoted" = true || { echo "Unable to promote npm latest"; exit 1; }
          for attempt in $(seq 1 60); do
            npm view twenty-omnichannel-support dist-tags --json --prefer-online --cache "/tmp/npm-publish-tag-verification-$attempt" > /tmp/dist-tags.json
            if node -e "const tags=require('/tmp/dist-tags.json'); const v=require('./package.json').version; if(tags.beta!==v || tags.latest!==v)process.exit(1)"; then
              echo "Verified npm beta and latest both point to $VERSION"
              exit 0
            fi
            echo "npm tags are propagating (attempt $attempt/60)."
            sleep 10
          done
          echo "npm dist-tags did not converge to $VERSION"
          cat /tmp/dist-tags.json
          exit 1

  promote_existing:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[promote npm]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.5.0'
          registry-url: https://registry.npmjs.org
      - name: Install npm with dist-tag OIDC support
        run: npm install --global 'npm@^11.21.0'
      - name: Promote an existing published version
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [ -z "$PACKAGE_VERSION" ]; then
            PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          fi
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Expected a valid published version (for example 0.3.0-beta.8)"
            exit 1
          fi
          for attempt in $(seq 1 60); do
            if npm dist-tag add "twenty-omnichannel-support@$PACKAGE_VERSION" latest; then break; fi
            if [ "$attempt" -eq 60 ]; then echo "Could not promote npm latest"; exit 1; fi
            sleep 10
          done
          for attempt in $(seq 1 60); do
            # Force a fresh npm metadata request on each verification attempt.
            npm view twenty-omnichannel-support dist-tags --json --prefer-online --cache "/tmp/npm-tag-verification-$attempt" > /tmp/promoted-tags.json
            if node -e "const tags=require('/tmp/promoted-tags.json'); const v=process.argv[1]; if(tags.beta!==v || tags.latest!==v)process.exit(1)" "$PACKAGE_VERSION"; then
              echo "Verified npm latest and beta: $PACKAGE_VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "npm dist-tags not yet consistent"; cat /tmp/promoted-tags.json; exit 1
